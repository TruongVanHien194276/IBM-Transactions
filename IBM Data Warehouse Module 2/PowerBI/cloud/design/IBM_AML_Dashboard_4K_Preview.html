<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBM AML — Power BI Cloud Design</title>
<style>
  :root {
    --navy:#0B1220; --navy-2:#111C32; --ink:#111827; --muted:#657084;
    --bg:#F3F5F8; --panel:#FFFFFF; --line:#E4E8EF; --blue:#2563EB;
    --cyan:#0891B2; --teal:#0F766E; --red:#C93C4A; --amber:#D97706;
    --violet:#6D5BD0; --green:#15803D; --soft-blue:#EAF1FF;
    --soft-red:#FCEAEC; --soft-green:#E9F6EE; --soft-amber:#FFF3DF;
  }
  * { box-sizing:border-box; }
  html, body { width:1920px; height:1080px; margin:0; overflow:hidden; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-rendering:geometricPrecision; -webkit-font-smoothing:antialiased;
  }
  .shell { display:grid; grid-template-columns:252px 1fr; width:100%; height:100%; }
  .sidebar {
    background:var(--navy); color:#fff; padding:31px 23px 26px;
    display:flex; flex-direction:column; position:relative;
  }
  .brand { display:flex; align-items:center; gap:13px; margin:2px 7px 40px; }
  .brand-mark {
    width:37px; height:37px; border-radius:10px; background:#fff;
    color:var(--navy); display:grid; place-items:center; font-weight:800; letter-spacing:-1px;
  }
  .brand-title { font-size:18px; line-height:1.1; font-weight:750; letter-spacing:.1px; }
  .brand-sub { color:#8D9AB0; font-size:11px; margin-top:5px; letter-spacing:.35px; }
  .nav-label {
    color:#718097; font-size:10px; font-weight:700; letter-spacing:1.3px;
    margin:0 12px 12px; text-transform:uppercase;
  }
  .nav { display:flex; flex-direction:column; gap:7px; }
  .nav-item {
    display:flex; align-items:center; gap:13px; min-height:47px; padding:0 13px;
    border-radius:9px; color:#AFB9C9; font-size:13px; font-weight:570;
    text-decoration:none; cursor:pointer; transition:background .15s ease,color .15s ease;
  }
  .nav-item:hover { background:#111C32; color:#fff; }
  .nav-item.active { background:#17294A; color:#fff; box-shadow:inset 3px 0 0 #5F8BFF; }
  .nav-icon { width:22px; text-align:center; color:#7D8BA1; font-size:16px; }
  .nav-item.active .nav-icon { color:#7FA2FF; }
  .side-note {
    margin-top:auto; background:var(--navy-2); border:1px solid #24324A; border-radius:10px;
    padding:14px; color:#93A0B4; font-size:11px; line-height:1.55;
  }
  .side-note strong { display:block; color:#D8DFEA; font-size:12px; margin-bottom:2px; }
  main { padding:26px 31px 24px; min-width:0; }
  .topbar { height:66px; display:flex; align-items:flex-start; justify-content:space-between; }
  .title h1 { margin:0; font-size:27px; letter-spacing:-.55px; font-weight:750; }
  .title p { margin:8px 0 0; color:var(--muted); font-size:13px; }
  .report-meta { text-align:right; color:#7A8496; font-size:11px; line-height:1.5; }
  .report-meta strong { color:#263247; font-size:12px; }
  .filterbar {
    height:51px; background:#fff; border:1px solid var(--line); border-radius:11px;
    display:flex; align-items:center; gap:10px; padding:0 13px; margin-bottom:17px;
  }
  .filter-title { color:#667085; font-size:11px; font-weight:700; letter-spacing:.5px; margin-right:2px; }
  .filter-chip {
    height:29px; padding:0 12px; border-radius:7px; border:1px solid #DEE4EC;
    background:#F9FAFB; display:flex; align-items:center; gap:10px; min-width:138px;
    color:#273348; font-size:11px;
  }
  .filter-chip span { margin-left:auto; color:#9AA4B2; font-size:9px; }
  .filter-status {
    margin-left:auto; color:#536173; font-size:10px; display:flex; align-items:center; gap:7px;
  }
  .status-dot { width:7px; height:7px; background:var(--green); border-radius:50%; }
  .content { height:896px; display:flex; flex-direction:column; gap:17px; }
  .kpi-row { display:grid; gap:14px; height:132px; }
  .kpi-row.six { grid-template-columns:repeat(6, 1fr); }
  .kpi-row.four { grid-template-columns:repeat(4, 1fr); }
  .kpi-row.five { grid-template-columns:repeat(5, 1fr); }
  .kpi {
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 17px 14px;
    position:relative; overflow:hidden;
  }
  .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent); }
  .kpi-label { color:#687386; font-size:11px; font-weight:650; letter-spacing:.15px; }
  .kpi-value { margin-top:13px; font-size:27px; font-weight:760; letter-spacing:-.55px; }
  .kpi-foot { margin-top:10px; color:#8A94A3; font-size:10px; display:flex; justify-content:space-between; }
  .pill { padding:3px 7px; border-radius:999px; font-size:9px; font-weight:700; }
  .pill.blue { color:#1D4ED8; background:#E8F0FF; }
  .pill.red { color:#A82736; background:#FCE8EB; }
  .pill.green { color:#166534; background:#E8F5EC; }
  .pill.amber { color:#9A5B08; background:#FFF1D7; }
  .row { display:grid; gap:17px; min-height:0; }
  .row.two-one { grid-template-columns:2fr 1fr; }
  .row.one-one { grid-template-columns:1fr 1fr; }
  .row.five-seven { grid-template-columns:5fr 7fr; }
  .row.seven-five { grid-template-columns:7fr 5fr; }
  .panel {
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:17px 18px 15px;
    min-width:0; min-height:0; overflow:hidden;
  }
  .panel-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
  .panel-title { font-size:13px; font-weight:740; color:#202A3B; }
  .panel-sub { color:#8A94A3; font-size:10px; margin-top:4px; }
  .legend { display:flex; align-items:center; gap:13px; color:#737E90; font-size:10px; }
  .legend i { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px; }
  .chart { width:100%; height:calc(100% - 35px); }
  svg { overflow:visible; }
  svg text { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .bar-list { display:flex; flex-direction:column; gap:10px; padding-top:2px; }
  .bar-row { display:grid; grid-template-columns:150px 1fr 68px; align-items:center; gap:11px; font-size:10px; }
  .bar-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#3A4659; }
  .bar-track { height:12px; background:#EEF1F5; border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; }
  .bar-value { text-align:right; color:#5D687A; font-variant-numeric:tabular-nums; }
  .stack-list { display:flex; flex-direction:column; gap:11px; }
  .stack-row { display:grid; grid-template-columns:132px 1fr 60px; gap:10px; align-items:center; font-size:10px; }
  .stack-track { display:flex; height:13px; border-radius:4px; overflow:hidden; background:#EEF1F5; }
  .stack-track i { height:100%; display:block; }
  .donut-wrap { display:flex; align-items:center; justify-content:center; gap:22px; height:100%; }
  .donut { width:154px; height:154px; border-radius:50%; position:relative; flex:none; }
  .donut::after { content:""; position:absolute; inset:32px; background:#fff; border-radius:50%; }
  .donut-center { position:absolute; inset:0; display:grid; place-content:center; text-align:center; z-index:2; }
  .donut-center strong { font-size:19px; }
  .donut-center span { font-size:9px; color:#808B9C; margin-top:3px; }
  .donut-legend { display:flex; flex-direction:column; gap:9px; min-width:150px; }
  .donut-legend div { display:grid; grid-template-columns:9px 1fr auto; gap:8px; align-items:center; font-size:9px; color:#596578; }
  .donut-legend i { width:8px; height:8px; border-radius:2px; }
  .table-wrap { height:100%; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:9.6px; font-variant-numeric:tabular-nums; }
  th { color:#667085; background:#F7F8FA; text-align:left; font-size:9px; letter-spacing:.25px; padding:9px 10px; border-bottom:1px solid #E2E7EE; }
  td { padding:8px 10px; border-bottom:1px solid #EDF0F4; color:#334055; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
  td.num, th.num { text-align:right; }
  .risk-bar { display:flex; align-items:center; gap:7px; justify-content:flex-end; }
  .risk-bar i { display:block; height:6px; border-radius:4px; background:#D45461; }
  .status { font-size:8.5px; font-weight:750; letter-spacing:.3px; }
  .status.pass { color:#166534; } .status.fail { color:#A82736; }
  .heatmap { display:grid; gap:3px; height:100%; }
  .heat-head, .heat-row { display:grid; grid-template-columns:70px repeat(6, 1fr); gap:3px; }
  .heat-head div { color:#687386; font-size:8.5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .heat-head div:first-child { text-align:left; }
  .heat-row div { min-height:16px; border-radius:2px; display:grid; place-items:center; font-size:7px; color:#fff; }
  .heat-row .heat-label { color:#6D788A; background:transparent; justify-content:start; font-size:8.5px; }
  .insight {
    border-left:3px solid var(--blue); background:#F7F9FC; border-radius:0 8px 8px 0;
    padding:12px 13px; color:#556174; font-size:10px; line-height:1.55;
  }
  .insight strong { color:#253146; display:block; margin-bottom:3px; }
  .mini-metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mini-metric { background:#F8F9FB; border:1px solid #E8ECF2; border-radius:9px; padding:11px; }
  .mini-metric span { display:block; color:#7C8798; font-size:9px; }
  .mini-metric strong { display:block; color:#243044; font-size:17px; margin-top:6px; }
  .footer-note { color:#8993A1; font-size:9px; text-align:right; margin-top:5px; }
  .page-tag { color:#758196; font-size:10px; font-weight:650; letter-spacing:.5px; }
</style>

function fmt(n) {
  const v = Number(n || 0), a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(2).replace(".",",") + " B";
  if (a >= 1e6) return (v/1e6).toFixed(2).replace(".",",") + " M";
  if (a >= 1e3) return (v/1e3).toFixed(1).replace(".",",") + " K";
  return Math.round(v).toLocaleString("vi-VN");
}
function fmtFull(n) { return Math.round(Number(n || 0)).toLocaleString("vi-VN"); }
function pct(n, d=2) { return Number(n || 0).toFixed(d).replace(".",",") + "%"; }

function lineSvg(rows, series, opts={}) {
  const W=920,H=310,L=64,R=18,T=18,B=42, iw=W-L-R, ih=H-T-B;
  const values = rows.flatMap(r => series.map(s => Number(r[s.key] || 0)));
  const max = Math.max(...values,1), min = opts.zero ? 0 : Math.min(...values,0);
  const range = Math.max(max-min,1);
  const x = i => L + (rows.length<2?0:i*iw/(rows.length-1));
  const y = v => T + ih - (v-min)*ih/range;
  const grids = [0,.25,.5,.75,1].map(p => {
    const yy=T+ih*p, val=max-(max-min)*p;
    return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#E7EBF1" stroke-width="1"/>
      <text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="10" fill="#7C8798">${fmt(val)}</text>`;
  }).join("");
  const paths = series.map((s,si) => {
    const pts=rows.map((r,i)=>`${x(i)},${y(Number(r[s.key]||0))}`);
    let area="";
    if (si===0 && opts.area) {
      area=`<polygon points="${L},${T+ih} ${pts.join(" ")} ${W-R},${T+ih}" fill="${s.color}" opacity=".08"/>`;
    }
    return `${area}<polyline points="${pts.join(" ")}" fill="none" stroke="${s.color}" stroke-width="${si===0?3:2}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join("");
  const labels = [0,Math.floor((rows.length-1)/2),rows.length-1].map(i =>
    `<text x="${x(i)}" y="${H-14}" text-anchor="${i===0?"start":i===rows.length-1?"end":"middle"}" font-size="10" fill="#7C8798">${safe(rows[i]?.short||rows[i]?.date||"")}</text>`
  ).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grids}${paths}${labels}</svg>`;
}
function comboSvg(rows) {
  const W=920,H=310,L=64,R=18,T=18,B=42, iw=W-L-R, ih=H-T-B;
  const txMax=Math.max(...rows.map(r=>r.transactions),1), amlMax=Math.max(...rows.map(r=>r.aml),1);
  const step=iw/rows.length, bw=Math.max(5,step*.55);
  const bars=rows.map((r,i)=>{
    const h=r.transactions/txMax*ih, xx=L+i*step+(step-bw)/2;
    return `<rect x="${xx}" y="${T+ih-h}" width="${bw}" height="${h}" rx="2" fill="#C9D8F8"/>`;
  }).join("");
  const points=rows.map((r,i)=>`${L+i*step+step/2},${T+ih-r.aml/amlMax*ih}`);
  const grids=[0,.25,.5,.75,1].map(p=>`<line x1="${L}" y1="${T+ih*p}" x2="${W-R}" y2="${T+ih*p}" stroke="#E7EBF1"/>`).join("");
  const labels=[0,Math.floor((rows.length-1)/2),rows.length-1].map(i=>`<text x="${L+i*step+step/2}" y="${H-14}" text-anchor="middle" font-size="10" fill="#7C8798">${rows[i].short}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grids}${bars}
    <polyline points="${points.join(" ")}" fill="none" stroke="#C93C4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${labels}</svg>`;
}
function barList(rows, labelKey, valueKey, color, limit=10) {
  const data=rows.slice(0,limit), max=Math.max(...data.map(r=>Number(r[valueKey]||0)),1);
  return `<div class="bar-list">${data.map(r=>`<div class="bar-row">

    <div class="bar-value">${fmt(r[valueKey])}</div></div>`).join("")}</div>`;
}
function stackList(rows, labelKey, aKey, bKey, colors, limit=8) {
  const data=rows.slice(0,limit), max=Math.max(...data.map(r=>Number(r[aKey])+Number(r[bKey])),1);
  return `<div class="stack-list">${data.map(r=>{
    const a=Number(r[aKey]),b=Number(r[bKey]),total=a+b;
    return `<div class="stack-row"><div class="bar-label">${safe(r[labelKey])}</div>
      <div class="stack-track" style="width:${Math.max(5,100*total/max)}%"><i style="width:${100*a/total}%;background:${colors[0]}"></i><i style="width:${100*b/total}%;background:${colors[1]}"></i></div>
      <div class="bar-value">${fmt(total)}</div></div>`;
  }).join("")}</div>`;
}
function donut(rows, labelKey, valueKey, limit=5) {
  const data=rows.slice(0,limit), total=data.reduce((s,r)=>s+Number(r[valueKey]),0);
  let cursor=0; const stops=data.map((r,i)=>{ const next=cursor+100*Number(r[valueKey])/total; const part=`${COLORS[i]} ${cursor}% ${next}%`; cursor=next; return part; });
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops.join(",")})">
    <div class="donut-center"><strong>${fmt(total)}</strong><span>Top ${limit}</span></div></div>
    <div class="donut-legend">${data.map((r,i)=>`<div><i style="background:${COLORS[i]}"></i><span>${safe(r[labelKey])}</span><b>${pct(100*Number(r[valueKey])/total,1)}</b></div>`).join("")}</div></div>`;
}
function scatter(rows, xKey, yKey, sizeKey, labelKey, color) {
  const W=760,H=300,L=60,R=24,T=18,B=40, iw=W-L-R, ih=H-T-B;
  const xmax=Math.max(...rows.map(r=>Number(r[xKey])),1), ymax=Math.max(...rows.map(r=>Number(r[yKey])),1), smax=Math.max(...rows.map(r=>Number(r[sizeKey])),1);
  const grids=[0,.25,.5,.75,1].map(p=>`<line x1="${L}" y1="${T+ih*p}" x2="${W-R}" y2="${T+ih*p}" stroke="#E7EBF1"/>`).join("");
  const dots=rows.map((r,i)=>{
    const x=L+Number(r[xKey])/xmax*iw, y=T+ih-Number(r[yKey])/ymax*ih, rad=4+10*Math.sqrt(Number(r[sizeKey])/smax);
    return `<circle cx="${x}" cy="${y}" r="${rad}" fill="${color}" opacity="${.35+(i<12?.35:0)}"><title>${safe(r[labelKey])}: ${fmt(r[xKey])} • ${pct(r[yKey])}</title></circle>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grids}${dots}
    <text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="#7C8798">Activity volume</text>
    <text x="13" y="${H/2}" text-anchor="middle" transform="rotate(-90 13 ${H/2})" font-size="10" fill="#7C8798">AML rate</text></svg>`;
}
function heatmap(data) {

    }).join("")}</div>`).join("")}</div>`;
}

  const r1=`<div class="row one-one" style="height:398px">
    ${panel("Top banks by activity","Total sender and receiver participations",barList(topBanks,"bank","total","#2563EB",10))}
    ${panel("Sent vs received mix","Composition of participation volume",stackList(topBanks,"bank","sent","received",["#2563EB","#8FB2F5"],10),
      legend([["Sent","#2563EB"],["Received","#8FB2F5"]]))}
  </div>`;
  const bankRows=topBanks.slice(0,9).map((r,i)=>[
    String(i+1),safe(r.bank),fmtFull(r.sent),fmtFull(r.received),fmtFull(r.total),fmtFull(r.aml),pct(r.amlRate)
  ]);
  const r2=`<div class="row five-seven" style="height:315px">
    ${panel("Activity share","Top-bank concentration",donut(topBanks,"bank","total",5))}
    ${panel("Bank ranking","Participation is not a distinct transaction count",table(
      [{label:"Rank"},{label:"Bank"},{label:"Sent",num:true},{label:"Received",num:true},{label:"Total",num:true},{label:"AML",num:true},{label:"AML rate",num:true}],bankRows))}
  </div>`;
  return shell("Bank Activity","Sender/receiver participation, concentration and risk comparison",4,cards+r1+r2);
}
function page5() {
  const all=DATA.currencies, total=all.reduce((s,r)=>s+r.transactions,0), aml=all.reduce((s,r)=>s+r.aml,0), top=all[0];
  const cards=`<div class="kpi-row four">
    ${kpi("Currency-flow transactions",fmt(total),"All corridors","#6D5BD0")}
    ${kpi("Currency-flow AML",fmtFull(aml),"All corridors","#C93C4A")}
    ${kpi("Corridor AML rate",pct(100*aml/total),"Weighted by transactions","#C93C4A")}
    ${kpi("Largest corridor",safe(top.pair),fmt(top.transactions)+" transactions","#0891B2")}
  </div>`;
  const r1=`<div class="row seven-five" style="height:393px">
    ${panel("Top currency corridors","Ranked by transaction volume",barList(all,"pair","transactions","#6D5BD0",11))}
    ${panel("Volume vs AML rate","Bubble size represents AML count",scatter(all.slice(0,80),"transactions","amlRate","aml","pair","#6D5BD0"))}
  </div>`;
  const paid=[...new Set(all.map(r=>r.paid))].slice(0,8), recv=[...new Set(all.map(r=>r.received))].slice(0,8);
  const lookup=new Map(all.map(r=>[r.paid+"|"+r.received,r.transactions])), max=Math.max(...all.map(r=>r.transactions),1);
  const matrix=`<div class="table-wrap"><table><thead><tr><th>Payment ↓ / Receiving →</th>${recv.map(x=>`<th class="num">${safe(x)}</th>`).join("")}</tr></thead><tbody>
    ${paid.map(p=>`<tr><td>${safe(p)}</td>${recv.map(r=>{const v=lookup.get(p+"|"+r)||0;return `<td class="num" style="background:rgba(109,91,208,${.06+.64*v/max});color:${v/max>.52?"#fff":"#334055"}">${v?fmt(v):"—"}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
  const topRows=all.slice(0,8).map((r,i)=>[String(i+1),safe(r.paid),safe(r.received),fmtFull(r.transactions),fmtFull(r.aml),pct(r.amlRate)]);
  const r2=`<div class="row seven-five" style="height:320px">
    ${panel("Currency-flow matrix","Conditional color shows volume; amounts are intentionally excluded",matrix)}
    ${panel("Corridor detail","Top routes for drill-through",table(
      [{label:"Rank"},{label:"Paid"},{label:"Received"},{label:"Transactions",num:true},{label:"AML",num:true},{label:"AML rate",num:true}],topRows))}
  </div>`;
  return shell("Currency Flow","Payment-to-receiving currency corridors without invalid cross-currency totals",5,cards+r1+r2);
}
function page6() {
  const p=DATA.patterns, attempts=p.reduce((s,r)=>s+r.attempts,0), tx=p.reduce((s,r)=>s+r.transactions,0), highest=[...p].sort((a,b)=>b.perAttempt-a.perAttempt)[0];
  const cards=`<div class="kpi-row four">
    ${kpi("Pattern attempts",fmtFull(attempts),"All known patterns","#6D5BD0")}
    ${kpi("Pattern transactions",fmtFull(tx),"Pattern-linked rows","#C93C4A")}
    ${kpi("Transactions / attempt",(tx/attempts).toFixed(2).replace(".",","),"Weighted ratio","#D97706")}
    ${kpi("Highest-intensity pattern",safe(highest.pattern),highest.perAttempt.toFixed(2).replace(".",",")+" tx/attempt","#0891B2")}
  </div>`;
  const r1=`<div class="row one-one" style="height:395px">
    ${panel("Transactions by pattern","Volume ranking",barList(p,"pattern","transactions","#6D5BD0",8))}
    ${panel("Attempts by pattern","Attempt frequency is different from transaction volume",barList([...p].sort((a,b)=>b.attempts-a.attempts),"pattern","attempts","#0891B2",8))}
  </div>`;
  const patternRows=p.map((r,i)=>[
    String(i+1),safe(r.pattern),fmtFull(r.attempts),fmtFull(r.transactions),r.perAttempt.toFixed(2).replace(".",","),
    `${r.minSequence} — ${r.maxSequence}`
  ]);
  const r2=`<div class="row five-seven" style="height:318px">
    ${panel("Pattern composition","Share of pattern-linked transactions",donut(p,"pattern","transactions",5))}
    ${panel("Pattern detail","Attempt, intensity and sequence boundaries",table(
      [{label:"Rank"},{label:"Pattern"},{label:"Attempts",num:true},{label:"Transactions",num:true},{label:"Tx / attempt",num:true},{label:"Sequence",num:true}],patternRows))}
  </div>`;
  return shell("Laundering Pattern","Attempt frequency, transaction intensity and sequence boundaries",6,cards+r1+r2);
}
function page7() {
  const b=DATA.batches, failed=b.filter(x=>x.status!=="COMPLETED").length, rejected=b.reduce((s,r)=>s+r.rejected,0);
  const passed=DATA.validations.filter(x=>x.status==="PASSED").length, total=DATA.validations.length;
  const cards=`<div class="kpi-row four">
    ${kpi("ETL batches",fmtFull(b.length),"Full + incremental","#2563EB")}
    ${kpi("Failed batches",fmtFull(failed),"Execution status",failed?"#C93C4A":"#15803D",failed?"CHECK":"PASS",failed?"red":"green")}
    ${kpi("Rejected rows",fmtFull(rejected),"All monitored batches",rejected?"#C93C4A":"#15803D",rejected?"CHECK":"PASS",rejected?"red":"green")}
    ${kpi("Validation pass rate",pct(100*passed/total),"Latest validation sample","#15803D","PASS","green")}
  </div>`;
  const batchSeries=b.map(x=>({short:"B"+x.batch,duration:x.duration}));
  const r1=`<div class="row five-seven" style="height:356px">
    ${panel("Batch duration","Minutes by batch",lineSvg(batchSeries,[{key:"duration",color:"#2563EB"}],{area:true,zero:true}))}
    ${panel("Batch history","Operational run and validation status",table(
      [{label:"Batch"},{label:"Load"},{label:"Status"},{label:"Minutes",num:true},{label:"Inserted",num:true},{label:"Reject",num:true},{label:"Validation"}],
      b.slice().reverse().map(r=>[String(r.batch),safe(r.loadType),`<span class="status ${r.status==="COMPLETED"?"pass":"fail"}">${safe(r.status)}</span>`,
      r.duration.toFixed(2),fmtFull(r.inserted),fmtFull(r.rejected),`<span class="status ${r.validation==="PASSED"?"pass":"fail"}">${safe(r.validation)}</span>`])))}
  </div>`;
  const valRows=DATA.validations.slice(0,11).map(r=>[
    String(r.batch),safe(r.check),fmtFull(r.source),fmtFull(r.target),fmtFull(r.difference),
    `<span class="status ${r.status==="PASSED"?"pass":"fail"}">${safe(r.status)}</span>`
  ]);
  const r2=`<div class="row seven-five" style="height:357px">
    ${panel("Validation detail","Source-to-target reconciliation by batch",table(
      [{label:"Batch"},{label:"Check"},{label:"Source",num:true},{label:"Target",num:true},{label:"Difference",num:true},{label:"Status"}],valRows))}
    ${panel("Quality controls","Why this page belongs in the submitted project",`
      <div class="mini-metric-grid">
        <div class="mini-metric"><span>Validation checks shown</span><strong>${fmtFull(total)}</strong></div>
        <div class="mini-metric"><span>Checks passed</span><strong>${fmtFull(passed)}</strong></div>
      </div>
      <div class="insight" style="margin-top:13px"><strong>Control statement</strong>
      The dashboard is traceable to ETL batches. A successful business dashboard is not complete until record counts, lookup integrity, rejected rows and validation outcomes are visible.</div>
      <div class="footer-note">Green status requires both ETL completion and validation pass.</div>`)}
  </div>`;
  return shell("ETL & Data Quality","Batch observability, reconciliation and release controls",7,cards+r1+r2);
}

const pages=[page1,page2,page3,page4,page5,page6,page7];
document.getElementById("app").innerHTML=pages[pageNo-1]();
</script>
